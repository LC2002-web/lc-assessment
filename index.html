<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khung Đánh Giá 樂歌 (LC)</title>
<style>
  :root{
    --ink:#1f2430; --sub:#5b6270; --line:#e3e5ea; --bg:#fafafa; --card:#ffffff;
    --heart:#b5495b; --art:#3a6ea5; --mission:#3f8f6b;
    --l1:#d95555; --l2:#e0a63a; --l3:#3a6ea5; --l4:#3f8f6b;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
  }

  .site-top{ position:sticky; top:0; z-index:100; background:var(--bg); }

  header{
    padding:24px 24px 12px; max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:nowrap;
  }
  header .titles{ flex:1 1 auto; min-width:0; }
  header .titles h1{ font-size:1.5rem; margin:0 0 4px; }
  header .titles p{ color:var(--sub); margin:0; font-size:0.95rem; }

  .lang-switch{ display:flex; gap:6px; flex:0 0 auto; }
  .lang-btn{
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-weight:700; font-size:0.85rem; padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .lang-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  nav{
    max-width:980px; margin:0 auto; padding:0 24px; display:flex; gap:8px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  nav button.tab-btn{
    background:none; border:none; padding:10px 14px; font-size:0.95rem; cursor:pointer;
    color:var(--sub); border-bottom:2px solid transparent; font-weight:700;
  }
  nav button.tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }

  main{ max-width:980px; margin:0 auto; padding:24px; }
  section.view{ display:none; }
  section.view.active{ display:block; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:16px;
  }
  .card h2{ margin-top:0; font-size:1.1rem; }
  .card h3{ font-size:0.98rem; margin:18px 0 6px; }
  .muted{ color:var(--sub); font-size:0.9rem; }

  .pillbar{ display:flex; gap:8px; margin:12px 0; }
  .pill{
    flex:1; text-align:center; font-size:1.05rem; font-weight:800; color:#fff;
    padding:12px 6px; border-radius:8px;
  }
  .pill.l1{background:var(--l1);} .pill.l2{background:var(--l2);}
  .pill.l3{background:var(--l3);} .pill.l4{background:var(--l4);}

  .level-def{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; border-left:5px solid var(--line); }
  .level-def.l1{ border-left-color:var(--l1); } .level-def.l2{ border-left-color:var(--l2); }
  .level-def.l3{ border-left-color:var(--l3); } .level-def.l4{ border-left-color:var(--l4); }
  .level-def .lvl-tag{ font-weight:700; font-size:0.85rem; margin-bottom:4px; }

  .assessment-sticky{ position:sticky; z-index:90; background:var(--bg); margin-top:-24px; padding-top:10px; padding-bottom:10px; border-bottom:1px solid var(--line); }

  .pillar-tabs{ display:flex; gap:10px; margin-bottom:0; flex-wrap:wrap; }
  .pillar-tab{
    border:1px solid var(--line); border-radius:999px; padding:9px 18px; cursor:pointer;
    font-size:0.9rem; font-weight:700; background:var(--card); color:var(--sub);
  }
  .pillar-tab.active[data-p="1"]{ background:var(--heart); color:#fff; border-color:var(--heart);}
  .pillar-tab.active[data-p="2"]{ background:var(--art); color:#fff; border-color:var(--art);}
  .pillar-tab.active[data-p="3"]{ background:var(--mission); color:#fff; border-color:var(--mission);}

  .pillar-block{ display:none; }
  .pillar-block.active{ display:block; }

  .indicator-nav{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px; }
  .indicator-chip{
    border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:0.8rem;
    font-weight:600; color:var(--ink); background:#fff; cursor:pointer; text-decoration:none;
  }
  .indicator-chip:hover{ background:#f2f2f4; }
  .indicator-chip.p1{ border-color:var(--heart); }
  .indicator-chip.p2{ border-color:var(--art); }
  .indicator-chip.p3{ border-color:var(--mission); }

  .indicator{ border-left:4px solid var(--line); padding-left:14px; margin-bottom:22px; scroll-margin-top:16px; }
  .indicator.p1{ border-color:var(--heart); }
  .indicator.p2{ border-color:var(--art); }
  .indicator.p3{ border-color:var(--mission); }
  .indicator h3{ margin:0 0 12px; }

  .statement{
    background:#fbfbfc; border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:12px; scroll-margin-top:16px;
  }
  .statement .label{ font-size:0.85rem; font-weight:800; color:var(--ink); letter-spacing:.02em; text-transform:uppercase; }
  .statement blockquote{ margin:8px 0 0; padding-left:14px; border-left:3px solid var(--line); font-size:1.1rem; font-weight:600; font-style:normal; color:var(--ink); line-height:1.55; }
  .statement .cues{ margin-top:22px; }

  .cue-row{ display:flex; gap:8px; margin-bottom:7px; align-items:flex-start; }
  .cue-tag{ flex:0 0 40px; text-align:center; font-size:0.72rem; font-weight:700; color:#fff; border-radius:5px; padding:3px 0; height:fit-content; }
  .cue-tag.l1{background:var(--l1);} .cue-tag.l2{background:var(--l2);}
  .cue-tag.l3{background:var(--l3);} .cue-tag.l4{background:var(--l4);}
  .cue-text{ font-size:0.83rem; color:var(--sub); }

  .steps{ padding-left:20px; }
  .steps li{ margin-bottom:10px; }

  @media (max-width: 600px){
    header{ padding:20px 16px 10px; flex-wrap:wrap; align-items:flex-start; }
    header .titles h1{ font-size:1.25rem; }
    nav{ padding:0 16px; }
    main{ padding:16px; }
    .assessment-sticky{ margin-top:-16px; padding-top:8px; }
    .card{ padding:16px; }
    .pillbar{ flex-wrap:wrap; }
    .pill{ flex:1 1 40%; font-size:0.9rem; padding:10px 6px; }
    .cue-tag{ flex:0 0 34px; font-size:0.68rem; }
  }
</style>
</head>
<body>

<div class="site-top" id="site-top">
<header>
  <div class="titles">
    <h1 id="h1-title">Khung Đánh Giá 樂歌 (LC)</h1>
  </div>
  <div class="lang-switch" id="lang-switch">
    <button class="lang-btn active" data-lang="vi">VN</button>
    <button class="lang-btn" data-lang="zh">CN</button>
  </div>
</header>

<nav>
  <button class="tab-btn active" data-view="guideline" id="nav-guideline">Hướng Dẫn Đánh Giá</button>
  <button class="tab-btn" data-view="assessment" id="nav-assessment">Bộ Đánh Giá</button>
</nav>
</div>

<main>

  <!-- RATING GUIDELINE -->
  <section class="view active" id="view-guideline">
    <div id="guideline-root"></div>
  </section>

  <!-- ASSESSMENT -->
  <section class="view" id="view-assessment">
    <div class="assessment-sticky" id="assessment-sticky">
      <div class="pillar-tabs" id="pillar-tabs"></div>
    </div>

    <div id="assessment-root" style="margin-top:16px;"></div>
  </section>

</main>

<script>

  vi: ["Sơ sinh","Phát triển","Trưởng thành","Tiếp nối"],
  zh: ["嬰兒期","成長期","成熟期","傳承期"]
};
const LEVEL_CLASS = ["l1","l2","l3","l4"];

  vi: {
    docTitle: "Khung Đánh Giá 樂歌 (LC)",
    h1: "Khung Đánh Giá 樂歌 (LC)",

    navAssessment: "Bộ Đánh Giá",
    statementLabel: "Câu phát biểu",
    indicatorStrip: /^Tiêu Chí \d+:\s*/,

  zh: {

    navGuideline: "評分指南",
    navAssessment: "評估問卷",
    statementLabel: "陳述",
    indicatorStrip: /^指標\d+[:：]\s*/,
    pillarPrefix: "支柱"
  }
};

const GUIDELINE_HTML = {
  vi: `
    <div class="card">
      <h2>Trước khi đánh giá</h2>
      <p>Bạn sẽ được yêu cầu đánh giá một loạt câu phát biểu về LC - từ những điều như việc học Kinh Thánh có diễn ra đều đặn không, ca viên mới có được kèm cặp không, cho đến các sự kiện truyền giảng có được lên kế hoạch với thân hữu trong tâm trí không.</p>
      <p>Có tổng cộng 3 Trụ Cột:</p>
      <ol class="steps">
        <li>Thuộc Linh</li>
        <li>Âm Nhạc</li>
        <li>Sứ Mệnh</li>
      </ol>
      <p>Mỗi trụ cột có 2 hoặc 3 Tiêu Chí, dưới mỗi Tiêu Chí là các câu phát biểu liên quan.</p>
      <p>Tổng cộng có <b>16 câu phát biểu</b>.</p>
      <p>Với mỗi câu phát biểu, bạn sẽ đưa ra hai đánh giá:</p>
      <ul>
        <li><b>Hiện tại</b>: mọi thứ đang ở đâu bây giờ, và</li>
        <li><b>Mong muốn</b>: bạn muốn nó ở đâu.</li>
      </ul>
    </div>

    <div class="card">
      <h2>Bạn đang đánh giá cái gì?</h2>
      <p>Với mỗi câu phát biểu, đừng hỏi "điều này có đang được làm tốt không?", thay vào đó hãy hỏi:</p>
      <p><b>"Nếu những người đang làm điều này rời đi vào ngày mai, nó có còn được duy trì nữa hay không?"</b></p>
      <p>Hôm nay việc này có thể được thực hiện rất tốt nhưng nếu nó chỉ sống được nhờ một hoặc hai người nào đó và không ai khác đang được hướng dẫn để tiếp nối thì nó không ở "Cấp độ 4".</p>
      <p>Với từng câu phát biểu, hãy hỏi: <i>có ai đó thực sự đang được huấn luyện để tiếp quản việc này không?</i></p>
      <ul>
        <li>Nếu có → <b>Cấp độ 4.</b></li>
        <li>Nếu nó chỉ đang được làm tốt bởi bất kỳ ai đang làm hiện tại, và không ai khác đang học điều đó → <b>Cấp độ 3.</b></li>
      </ul>
      <p class="muted">Nhiều điểm "Cấp độ 3" có thể tạo cảm giác thỏa mãn, vì mọi thứ trông ổn ngay bây giờ. Nhưng hãy thử nhìn theo hướng khác: Cấp độ 3 thực ra là một lời cảnh báo - nó có nghĩa là phương diện này chỉ sống được nhờ một hoặc hai cá nhân, và vấn đề sẽ hiện hữu khi họ không còn đó nữa.</p>
      <p class="muted">"Cấp độ 3" cũng tạo ra sự cấp bách trong việc tìm người tiếp nối so với "Cấp độ 1" (ban ngành chưa từng làm việc này).</p>
    </div>

    <div class="card">
      <h2>Bốn Cấp Độ</h2>
      <div class="pillbar">
        <div class="pill l1">L1 Sơ sinh</div><div class="pill l2">L2 Phát triển</div><div class="pill l3">L3 Trưởng thành</div><div class="pill l4">L4 Tiếp nối</div>
      </div>
      <div class="level-def l1"><div class="lvl-tag">Cấp độ 1 — Sơ sinh</div>Điều này về cơ bản không xảy ra trừ khi người dẫn dắt và thúc đẩy nó. Nếu không còn người lãnh đạo, điều này sẽ ngay lập tức dừng lại.</div>
      <div class="level-def l2"><div class="lvl-tag">Cấp độ 2 — Phát triển</div>Mọi người bắt đầu học tập để thực hành hoặc làm quen với điều này, lúc thì làm tốt, lúc thì không hoặc làm nửa vời. Vẫn cần có người lãnh đạo thúc đẩy.</div>
      <div class="level-def l3"><div class="lvl-tag">Cấp độ 3 — Trưởng thành</div>Mọi người đã quen với điều này và nhìn chung thực hiện tốt, nhưng có điểm yếu là chỉ một số ít người thực sự có thể dẫn dắt và thúc đẩy việc này. Nếu những người đó rời đi, mọi thứ khả năng sẽ trở về giai đoạn sơ sinh.</div>
      <div class="level-def l4"><div class="lvl-tag">Cấp độ 4 — Tiếp nối</div>Điều này đã thật sự trở thành một phần văn hóa của ban ngành — không chỉ là thói quen của những người hiện tại. Người có kinh nghiệm chủ động làm mẫu, nhắc nhở, và hướng dẫn để giá trị hay thực hành này được thành viên mới tiếp nhận một cách tự nhiên. Vì vậy, điều này vẫn tiếp tục ngay cả khi những người lãnh đạo hiện tại rời đi.</div>
    </div>
  `,
  zh: `
    <div class="card">
      <h2>評分前須知</h2>
      <p>你將要對一系列關於『樂歌團契』的陳述句作出評分 - 從聖經學習是否穩定進行,新詩班員是否有人指導,到外展活動規劃時是否以福音為核心等等。</p>
      <p>這評分框架共有3大支柱:</p>
      <ol class="steps">
        <li>靈命</li>
        <li>音樂</li>
        <li>使命</li>
      </ol>
      <p>每個支柱下有2到3個指標,每個指標下面是相關的陳述句。</p>
      <p>總共有 <b>16句陳述句</b>。</p>
      <p>對每一句陳述句,你會給出兩個評分:</p>
      <ul>
        <li><b>現況</b>:現在的情況是怎樣,以及</li>
        <li><b>目標</b>:你希望它變成怎樣。</li>
      </ul>
    </div>

    <div class="card">
      <h2>你在評分什麼?</h2>
      <p>對每一句陳述句,不要問「這件事做得好不好?」,而是要問:</p>
      <p><b>「如果現在做這件事的人明天離開了,這件事還會繼續發生嗎?」</b></p>
      <p>今天這件事也許被做得很好,但如果它只靠一兩位同工才能實現,而沒有其他人正在被培養來接手,那它就還不是「L4」。</p>
      <p>對每一句陳述句,問自己:<i>真的有人正在被培養來接手這件事嗎?</i></p>
      <ul>
        <li>如果有 → <b>L4</b></li>
        <li>如果它只是被現在正在做的人做得好,而沒有其他人正在學習這件事 → <b>L3</b></li>
      </ul>
      <p class="muted">很多「L3」的評分可能讓人感覺很滿足,因為現在看起來一切都還好。但試著換個角度看:L3其實是一個警訊 - 代表這個層面只靠一兩個人在撐著,一旦他們不在了,問題就會浮現。</p>
      <p class="muted">「L3」也比「L1」(團契從來沒做過這件事)更有<i>尋找接班人的急迫性</i>。</p>
    </div>

    <div class="card">
      <h2>四個等級</h2>
      <div class="pillbar">
        <div class="pill l1">L1 嬰兒期</div><div class="pill l2">L2 成長期</div><div class="pill l3">L3 成熟期</div><div class="pill l4">L4 傳承期</div>
      </div>
      <div class="level-def l1"><div class="lvl-tag">L1 - 嬰兒期</div>除非有人主動帶領並推動,否則這件事基本上不會發生。一旦這個人不在了,這件事就會立刻停止。</div>
      <div class="level-def l2"><div class="lvl-tag">L2 - 成長期</div>大家開始學習實踐或熟悉這件事,有時做得好,有時做不好或半途而廢。仍然需要有人帶領推動。</div>
      <div class="level-def l3"><div class="lvl-tag">L3 - 成熟期</div>大家已經習慣這件事,整體上做得不錯,但弱點在於只有少數人真的能帶領並推動這件事。如果這些人離開,一切很可能會退回嬰兒期。</div>
      <div class="level-def l4"><div class="lvl-tag">L4 - 傳承期</div>這件事已經真正成為團契文化的一部分,不只是現在這些人的習慣。有經驗的人會主動示範,提醒,並帶領,讓新成員自然地承接這個價值或做法。因此,即使現在的帶領者離開,這件事仍會持續下去。</div>
    </div>
  `
};

const DATA = {

      indicators: [

            cues:["diễn ra lẻ tẻ, tự phát, và không có hệ thống; chỉ xảy ra khi có người chủ động khởi xướng và duy trì việc lên kế hoạch","có tổ chức trong một khoảng thời gian nhưng không đều đặn qua các năm; vẫn cần một người cụ thể liên tục thúc đẩy để duy trì","việc học được tổ chức có hệ thống và kế hoạch rõ ràng, nhưng chỉ số ít người có thể hướng dẫn","nhiều người thay phiên hướng dẫn, người mới được huấn luyện để dự phần"]},

        { num: 2, name: "Tiêu Chí 2: Tâm Thế Phục Vụ", statements: [
          { id:"2.1", title:"Thái độ với vai trò hậu trường", quote:"Khi được giao vai trò hậu trường, thành viên đảm nhận mà không phản kháng, phàn nàn, hay yêu cầu chuyển sang vai trò nổi bật hơn (trên sân khấu/solo).",
            cues:["thành viên thường phản kháng hoặc phàn nàn khi được giao vai trò hậu trường; chỉ khi người hướng dẫn trực tiếp can thiệp thì họ mới miễn cưỡng chấp nhận","một số chấp nhận, một số phản kháng, tùy người được giao","thành viên hiện tại chấp nhận tốt, nhưng chưa thể định hình thành viên mới theo tinh thần đó","đây là văn hóa rõ ràng của ban ngành; thành viên hiện tại chủ động làm gương và nhắc nhở, giúp thành viên mới tiếp nhận thái độ này một cách tự nhiên ngay từ khi mới tham gia"]},
          { id:"2.2", title:"Sẵn lòng hạ mình", quote:"Các thành viên kỳ cựu nhường vị trí trình diễn/solo cho thành viên trẻ hơn.",
            cues:["thành viên kỳ cựu giữ các vị trí trình diễn/solo cho riêng mình, không nhường lại cho người trẻ hơn dù có cơ hội","thỉnh thoảng xảy ra, nhưng chưa rõ sự chủ động, phụ thuộc nhiều vào tình huống","thành viên kỳ cựu chủ động nhường cho người trẻ hơn, nhưng chủ yếu dựa vào nỗ lực cá nhân của số ít người","việc hạ mình đã trở thành một phần văn hóa của ban ngành; thành viên kỳ cựu chủ động làm mẫu cho người mới, giúp họ thấy đây là điều tự nhiên khi trưởng thành trong nhóm, không chỉ dựa vào ý thức cá nhân của một vài người"]}
        ]},
        { num: 3, name: "Tiêu Chí 3: Quan Tâm & Hiệp Nhất", statements: [
          { id:"3.1", title:"Quan tâm chia sẻ gánh nặng", quote:"Các thành viên cởi mở chia sẻ một khó khăn cá nhân với nhóm, và những người khác đáp lại bằng lời khích lệ, cầu thay, và sự giúp đỡ.",
            cues:["thành viên thường giữ kín khó khăn nan đề của mình; chỉ chia sẻ khi người hướng dẫn trực tiếp dẫn dắt","việc chia sẻ thỉnh thoảng xảy ra, phụ thuộc rất nhiều vào hoàn cảnh, tâm trạng, hoặc ai đang có mặt","thường xuyên diễn ra, phụ thuộc vào sự hòa hợp và tin tưởng hiện có của nhóm, dựa vào số ít người để thúc đẩy cuộc trò chuyện","diễn ra một cách tự nhiên và là một phần văn hóa của ban ngành; các thành viên có kinh nghiệm chủ động làm mẫu (cởi mở chia sẻ, chủ động hỏi thăm người khác), giúp thành viên mới thấy đây là điều bình thường và học theo"]},
          { id:"3.2", title:"Sự hiệp một", quote:"Thành viên lớn tuổi (Senior) quan tâm, khích lệ, và cố vấn cho thành viên nhỏ tuổi hơn (Junior) trong nhóm.",
            cues:["Junior phần lớn tự xoay xở một mình, có sự ngăn cách thế hệ rõ rệt","một số Senior quan tâm đến các Junior, nhưng không thường xuyên và phụ thuộc vào mối quan hệ cá nhân","một số Senior tích cực quan tâm và giúp đỡ Junior rất tốt, nhưng đó là vì tính cách sẵn có của những cá nhân này — chưa có gì đảm bảo các Senior khác cũng sẽ làm điều tương tự","việc cố vấn cho Junior là một việc rõ ràng và tự nhiên; Senior chủ động làm mẫu và hướng dẫn Junior, và thái độ này được tiếp nối bởi các Senior tương lai (những Junior hiện tại)"]}
        ]}
      ]
    },
    { pillar: 2, name: "Âm Nhạc", desc: "Đo lường khả năng kế thừa năng lực âm nhạc và lãnh đạo qua ba vai trò: ban hát, ban nhạc, và ca trưởng.",
      indicators: [
        { num: 4, name: "Tiêu Chí 4: Ban Hát", statements: [
          { id:"4.1", title:"Tiêu chuẩn của Ban Hát", quote:"Có tiêu chuẩn và kỳ vọng về việc chuẩn bị và tập luyện của ca viên.",
            cues:["không có tiêu chuẩn hay kỳ vọng nào được thiết lập; việc chuẩn bị hoàn toàn tùy thuộc vào từng ca viên","có một số kỳ vọng được đặt ra nhưng không được duy trì, ca viên nào tự giác thì làm, ai không thì thôi, không ai theo dõi hay nhắc nhở","tiêu chuẩn và kỳ vọng hiện đang được tuân thủ tốt, nhưng đó là nhờ ý thức của nhóm ca viên hiện tại, chứ chưa có gì đảm bảo ca viên mới sẽ được dạy hay yêu cầu làm theo","tiêu chuẩn này được duy trì và truyền lại cho ca viên mới (qua hướng dẫn và huấn luyện), nên vẫn được giữ vững bất kể ai đang có mặt"]},
          { id:"4.2", title:"Tính kế thừa của Ban Hát", quote:"Ca viên có kinh nghiệm dành thời gian kèm cặp một-một hoặc tổ chức lớp tập huấn để huấn luyện ca viên mới.",
            cues:["không có bất cứ sự kèm cặp hay workshop nào","thỉnh thoảng có tổ chức vài buổi huấn luyện, không đều đặn qua mỗi năm","tổ chức các buổi huấn luyện tập thể hoặc một-một, nhưng hoàn toàn phụ thuộc vào một hoặc hai người lĩnh xướng hiện tại","việc kèm cặp không chỉ phụ thuộc vào một hoặc hai người, mà nhiều ca viên có kinh nghiệm cùng tham gia huấn luyện; ca viên mới thực sự được trao cơ hội đảm nhận vai trò quan trọng trong dàn hợp xướng"]}
        ]},
        { num: 5, name: "Tiêu Chí 5: Ban Nhạc", statements: [
          { id:"5.1", title:"Nhân sự dự bị", quote:"Mỗi nhạc cụ trong ban nhạc có nhân sự dự bị đang được đào tạo để có thể đảm nhận vị trí đó khi cần.",
            cues:["không có nhân sự dự bị nào đang được chuẩn bị; nếu một nhạc công rời đi, vị trí đó bị bỏ trống hoặc phải tìm người từ bên ngoài","một vài nhạc cụ có nhân sự dự bị không chính thức, phần lớn còn lại không có, và nhạc công dự bị hiếm khi có cơ hội hầu việc thực sự","hầu hết nhạc cụ có một nhân sự dự bị, nhưng việc này phụ thuộc vào một hoặc hai người cố vấn hiện tại chủ động kèm cặp","mỗi nhạc cụ đều có ít nhất hai nhân sự dự bị đang được đào tạo một cách ổn định (qua kèm cặp hoặc lớp tập huấn), và họ thực sự được trao cơ hội hầu việc trong các buổi nhóm"]},
          { id:"5.2", title:"Đào tạo trưởng ban nhạc", quote:"Thành viên ban nhạc tiềm năng được huấn luyện và trao cơ hội thực sự để chỉ huy (dẫn dắt ban nhạc tập luyện, đưa ra quyết định phối khí).",
            cues:["không ai đang được đào tạo để đảm nhận vai trò này; nếu trưởng ban nhạc hiện tại vắng mặt, không ai khác có thể dẫn dắt buổi tập hay quyết định phối khí","thỉnh thoảng có người được thử giao một việc nhỏ (ví dụ: dẫn dắt một đoạn tập luyện), nhưng không có kế hoạch rõ ràng hay nhất quán","có một thành viên ban nhạc đang được trao cơ hội thực sự (chỉ huy buổi tập, quyết định phối khí) một cách khá đều đặn, nhưng hoàn toàn phụ thuộc vào việc trưởng ban nhạc hiện tại chủ động làm điều này; nếu người đó ngừng lại, việc phát triển người kế nhiệm cũng dừng theo","nhiều thành viên ban nhạc có tiềm năng đều có thể được huấn luyện và thử sức, việc này được tiến hành liên tục, không còn phụ thuộc vào trưởng ban nhạc hiện tại"]}
        ]},
        { num: 6, name: "Tiêu Chí 6: Ca Trưởng", statements: [
          { id:"6.1", title:"Tiêu chuẩn của Ca Trưởng", quote:"Có tiêu chuẩn và kỳ vọng về việc chuẩn bị trước mỗi buổi tập (nghiên cứu bản nhạc, kế hoạch tập luyện, quyết định phối khí) cho vai trò ca trưởng.",
            cues:["không có tiêu chuẩn hay kỳ vọng nào được thiết lập cho việc chuẩn bị; việc này hoàn toàn tùy thuộc vào thói quen cá nhân của người đang giữ vai trò ca trưởng","có một số kỳ vọng được nhắc đến nhưng không rõ ràng hay được duy trì; tùy người đang giữ vai trò có tự giác chuẩn bị hay không","ca trưởng hiện tại chuẩn bị tốt và nhất quán, nhưng đó là nhờ thói quen cá nhân của người này, chứ chưa có tiêu chuẩn nào được xác lập rõ ràng cho vai trò để người kế nhiệm biết và làm theo","tiêu chuẩn chuẩn bị cho vai trò ca trưởng đã được xác lập rõ ràng (ví dụ: được ghi lại hoặc truyền đạt cụ thể cho người kế nhiệm), nên bất kỳ ai đảm nhận vai trò này trong tương lai đều biết và được kỳ vọng làm theo, không phụ thuộc vào thói quen của riêng một cá nhân"]},
          { id:"6.2", title:"Đào tạo Ca Trưởng", quote:"Có kế hoạch và lộ trình để huấn luyện ca trưởng, trao cơ hội cho họ lựa chọn bài hát, dẫn dắt ban hát tập luyện, đưa ra quyết định phối khí - chứ không chỉ dựa vào người hiện tại.",
            cues:["không ai đang được phát triển để chỉ huy","thỉnh thoảng xảy ra, không có kế hoạch","ca trưởng hiện tại giỏi, nhưng không ai khác được trao cơ hội chỉ huy thực sự","có một lộ trình chủ đích trao cho nhạc công đang lên những kinh nghiệm chỉ huy/điều khiển thực sự"]}
        ]}
      ]
    },
    { pillar: 3, name: "Sứ Mệnh", desc: "Đo lường tính bền vững của sứ mệnh truyền giảng qua ba khía cạnh: nội dung chương trình, năng lực tổ chức sự kiện, và tính liên kết với các Hội Thánh khác.",
      indicators: [
        { num: 7, name: "Tiêu Chí 7: Chủ Đích Trong Truyền Giảng", statements: [
          { id:"7.1", title:"Nội dung lấy Phúc Âm làm trọng tâm", quote:"Khi lên kế hoạch cho một buổi truyền giảng, đội ngũ cẩn thận xem xét liệu bài hát, tiết mục, hay các phần trong chương trình có thực sự chứa đựng sứ điệp Thập Tự Giá và sự cứu rỗi hay không, chứ không chỉ dựa vào giá trị trình diễn hay giải trí.",
            cues:["tiết mục được chọn ưu tiên cho giá trị trình diễn/giải trí thay vì nội dung Phúc Âm","thỉnh thoảng được cân nhắc, tùy vào việc ai là người phụ trách nội dung","việc lựa chọn được tiến hành cẩn trọng, nhưng phụ thuộc vào số ít người \"am hiểu điều đó\" về mặt thuộc linh, không có quy trình rõ ràng","việc cân nhắc khía cạnh Phúc Âm là một bước có sẵn trong quy trình lên kế hoạch, được dạy cho bất kỳ ai lên kế hoạch nội dung tiếp theo"]},
          { id:"7.2", title:"Thiết kế lấy thân hữu làm trọng tâm", quote:"Khi lên kế hoạch cho một buổi truyền giảng, đội ngũ cẩn trọng xem xét liệu âm nhạc, chủ đề, và từ ngữ được dùng có được trình bày theo cách mà một thân hữu chưa quen thuộc với Hội Thánh có thể hiểu và tiếp nhận được hay không.",
            cues:["không ai cân nhắc góc nhìn của thân hữu","góc nhìn của thân hữu được cân nhắc, nhưng không bao phủ toàn bộ khía cạnh, không thường xuyên và nhất quán","được cân nhắc một cách đầy đủ, nhưng phụ thuộc vào số ít người \"có kinh nghiệm\"","luôn được cân nhắc mỗi khi thiết kế chương trình, việc rà soát nội dung qua lăng kính thân hữu là một bước có sẵn trong quy trình lên kế hoạch, được dạy cho bất kỳ ai lên kế hoạch tiếp theo chứ không phụ thuộc vào số ít người"]}
        ]},
        { num: 8, name: "Tiêu Chí 8: Năng Lực Tổ Chức Sự Kiện", statements: [
          { id:"8.1", title:"Khả năng tổ chức sự kiện", quote:"Đội ngũ có thể tổ chức và thực hiện trọn vẹn một sự kiện (truyền giảng, chia sẻ Thánh Ca, thờ phượng âm nhạc, v.v..).",
            cues:["không thể thực hiện sự kiện nếu thiếu một hoặc hai người cụ thể; cả vai trò ngoài âm nhạc lẫn cấu trúc chương trình đều phụ thuộc vào họ","vẫn thực hiện được nhưng chông chênh, có sai sót rõ rệt khi thiếu người đó, dù ở phần vai trò hay cấu trúc chương trình","thực hiện trôi chảy, nhưng vẫn phụ thuộc vào một hoặc hai người \"biết cách làm\" và lấp đầy vai trò còn thiếu","nhiều người biết cấu trúc chương trình và có thể đảm nhận các vai trò cần thiết; kiến thức và vai trò đã được truyền lại hoặc ghi lại, không phụ thuộc vào riêng ai"]}
        ]},
        { num: 9, name: "Tiêu Chí 9: Liên Kết Các Hội Thánh", statements: [
          { id:"9.1", title:"Kết nối và hỗ trợ Hội Thánh khác", quote:"Chủ động tổ chức hoặc hỗ trợ các hoạt động thánh nhạc cho các hội thánh khác (ví dụ: huấn luyện, hội thảo chung) không chỉ giới hạn trong nội bộ ban ngành.",
            cues:["hoàn toàn không có hoạt động nào hướng ra ngoài; mọi nỗ lực chỉ giới hạn trong nội bộ","thỉnh thoảng xảy ra, chỉ khi có cơ hội tình cờ hoặc một cá nhân cụ thể chủ động kết nối","diễn ra tương đối thường xuyên và có kết quả tốt, nhưng phụ thuộc vào một hoặc hai người có mối quan hệ hoặc sáng kiến cá nhân với các hội thánh khác","việc kết nối và hỗ trợ các hội thánh khác diễn ra thường xuyên và có hệ thống, được nhiều thành viên tham gia và tiếp nối, không chỉ dựa vào một vài cá nhân có mối quan hệ sẵn có"]}
        ]}
      ]
    }
  ],
  zh: [
    { pillar: 1, name: "靈命", desc: "衡量整個團契在靈命成熟度、謙卑的事奉心態,以及群體合一上的表現。",
      indicators: [
        { num: 1, name: "指標1:聖經基礎與禱告", statements: [
          { id:"1.1", title:"查經根基", quote:"團契在每週聚會中,以有系統的方式進行查經(逐卷逐章研讀),作為聚會的核心內容之一。",
            cues:["只是零星、隨興地發生,沒有系統;只有在有人主動發起並持續安排時才會進行","曾經有一段時間有系統地進行,但逐年並不穩定;仍然需要某個特定的人持續推動才能維持","查經有系統、有明確計畫地進行,但只有少數人能夠帶領","有好幾個人輪流帶領,新人也正在被培養加入帶領的行列"]},
          { id:"1.2", title:"集體禱告", quote:"團契會特別安排集體禱告時間,不只是聚會開始或結束簡短的禱告。",
            cues:["沒有人主動發起就不會發生","偶爾發生,不穩定","經常進行,但只有一兩個人懂得如何帶領","有好幾位成員輪流帶領,其他人也正在被培養學習帶領"]}
        ]},
        { num: 2, name: "指標2:事奉心態", statements: [
          { id:"2.1", title:"對幕後角色的態度", quote:"當被分配到幕後角色時,成員願意接受,不會反抗、抱怨,或要求換到更顯眼的角色(台前/獨唱)。",
            cues:["成員被分配幕後角色時經常反抗或抱怨;只有在負責人直接介入時才會勉強接受","有些人接受,有些人反抗,視分配到誰而定","現在的成員都能欣然接受,但還沒有辦法讓新成員也養成同樣的心態","這已經是團契明確的文化;現在的成員會主動示範並提醒他人,讓新成員從一加入就能自然地養成這種態度"]},
          { id:"2.2", title:"樂意讓位", quote:"資深成員將表演/獨唱的位置讓給較年輕的成員。",
            cues:["資深成員把持著表演/獨唱的位置,即使有機會也不讓給較年輕的成員","偶爾會發生,但看不出主動性,很大程度上取決於當下情況","資深成員主動讓位給較年輕的成員,但主要依靠少數人的個人自覺","讓位已經成為團契文化的一部分;資深成員會主動做示範,讓新人明白這是在團契中成長時自然會做的事,而不只是依靠少數人的個人自覺"]}

        { num: 3, name: "指標3:關懷與合一", statements: [

const PILLAR_TAB_LABELS = {
  vi: ["Trụ Cột 1 · Thuộc Linh","Trụ Cột 2 · Âm Nhạc","Trụ Cột 3 · Sứ Mệnh"],
  zh: ["支柱1 · 靈命","支柱2 · 音樂","支柱3 · 使命"]
};

let currentLang = "vi";
let currentPillar = "1";

function renderGuideline(){
  document.getElementById("guideline-root").innerHTML = GUIDELINE_HTML[currentLang];
}

function renderPillarTabs(){
  const wrap = document.getElementById("pillar-tabs");
  wrap.innerHTML = "";
  PILLAR_TAB_LABELS[currentLang].forEach((label, i) => {
    const p = String(i+1);
    const div = document.createElement("div");
    div.className = "pillar-tab" + (p === currentPillar ? " active" : "");
    div.dataset.p = p;
    div.textContent = label;
    div.addEventListener("click", () => {
      currentPillar = p;
      renderPillarTabs();
      document.querySelectorAll(".pillar-block").forEach(b => b.classList.toggle("active", b.dataset.p === p));
      window.scrollTo({ top: 0, behavior: "instant" });
    });
    wrap.appendChild(div);
  });
}

function renderAssessment(){
  const ui = UI[currentLang];
  const root = document.getElementById("assessment-root");
  root.innerHTML = "";
  DATA[currentLang].forEach(pillarData => {
    const block = document.createElement("div");
    block.className = "pillar-block" + (String(pillarData.pillar) === currentPillar ? " active" : "");
    block.dataset.p = pillarData.pillar;

    const introCard = document.createElement("div");
    introCard.className = "card";
    introCard.innerHTML = `<h2>${ui.pillarPrefix} ${pillarData.pillar} · ${pillarData.name}</h2>
      <p class="muted">${pillarData.desc}</p>`;
    block.appendChild(introCard);

    // indicator quick-jump nav
    const navRow = document.createElement("div");
    navRow.className = "indicator-nav";
    pillarData.indicators.forEach(ind => {
      const a = document.createElement("a");
      a.className = "indicator-chip p" + pillarData.pillar;
      a.href = "#ind-" + pillarData.pillar + "-" + ind.num;
      a.textContent = ind.name.replace(ui.indicatorStrip, "");
      navRow.appendChild(a);
    });
    block.appendChild(navRow);

    pillarData.indicators.forEach(ind => {
      const card = document.createElement("div");
      card.className = "card";
      const indDiv = document.createElement("div");
      indDiv.className = "indicator p" + pillarData.pillar;
      indDiv.id = "ind-" + pillarData.pillar + "-" + ind.num;
      indDiv.innerHTML = `<h3>${ind.name}</h3>`;

      ind.statements.forEach(st => {
        const sDiv = document.createElement("div");
        sDiv.className = "statement";
        sDiv.id = "st-" + st.id;
        sDiv.innerHTML = `
          <div class="label">${ui.statementLabel} ${st.id} · ${st.title}</div>
          <blockquote>“${st.quote}”</blockquote>
          <div class="cues">
            ${st.cues.map((c,i)=>`
              <div class="cue-row">
                <div class="cue-tag ${LEVEL_CLASS[i]}">L${i+1}</div>
                <div class="cue-text"><b>${LEVELS[currentLang][i]}</b> — ${c}</div>
              </div>
            `).join("")}
          </div>
        `;
        indDiv.appendChild(sDiv);
      });

      card.appendChild(indDiv);
      block.appendChild(card);
    });

    root.appendChild(block);
  });
}

function renderAll(){
  const ui = UI[currentLang];
  document.title = ui.docTitle;
  document.getElementById("h1-title").textContent = ui.h1;
  document.getElementById("nav-guideline").textContent = ui.navGuideline;
  document.getElementById("nav-assessment").textContent = ui.navAssessment;
  document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "vi";
  renderGuideline();
  renderPillarTabs();
  renderAssessment();
  recalcSticky();
}

function recalcSticky(){
  const siteTop = document.getElementById("site-top");
  const asmSticky = document.getElementById("assessment-sticky");
  if(siteTop && asmSticky){
    asmSticky.style.top = siteTop.offsetHeight + "px";
  }
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if(btn.dataset.lang === currentLang) return;
    currentLang = btn.dataset.lang;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderAll();
  });
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll("section.view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
    recalcSticky();
  });
});

renderAll();
window.addEventListener("resize", recalcSticky);
window.addEventListener("load", recalcSticky);
</script>
